[theme]
base = "light"
primaryColor = "#2a78d6"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
baseRadius = "0.75rem"
showWidgetBorder = true

[theme.light]
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ef"
textColor = "#0b0b0b"

[theme.dark]
backgroundColor = "#141413"
secondaryBackgroundColor = "#1f1f1e"
textColor = "#f5f4ef"

[client]
toolbarMode = "viewer"
